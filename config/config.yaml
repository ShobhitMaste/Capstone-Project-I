# ============================================================
# FedTrap — Central Configuration
# ============================================================
# All tuneable parameters live here. No hard-coding elsewhere.

project:
  name: FedTrap
  version: "0.1.0"

# --- Insect classes and decision policy ---
classes:
  beetle:
    index: 0
    category: PEST
    action: CAPTURE
  butterfly:
    index: 1
    category: BENEFICIAL
    action: RELEASE
  grasshopper:
    index: 2
    category: PEST
    action: CAPTURE
  honeybee:
    index: 3
    category: BENEFICIAL
    action: RELEASE
  moth:
    index: 4
    category: PEST
    action: CAPTURE

# --- Decision thresholds ---
decision:
  confidence_threshold: 0.85
  confirmation_frames: 3
  hold_duration_sec: 2.0
  unknown_action: NO_ACTION

# --- Servo (SG90) ---
servo:
  gpio: 18
  home_angle: 90
  capture_angle: 150
  release_angle: 30
  pwm_frequency: 50
  actuation_timeout_sec: 5.0
  use_pigpio: true   # pigpio for jitter-free PWM; false = RPi.GPIO fallback

# --- Camera ---
camera:
  resolution: [640, 480]
  fps: 30
  warmup_sec: 2.0
  motion_threshold: 25
  motion_min_area: 500

# --- Model ---
model:
  architecture: mobilenetv2
  num_classes: 5
  input_size: 224        # MobileNetV2 default; 320 for YOLO
  pretrained: true
  weights_path: "models/classifier_best.pt"

# --- Training ---
training:
  epochs: 15
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_scheduler: cosine
  freeze_epochs: 5       # epochs with backbone frozen
  seed: 42
  num_workers: 2
  img_size: 224

# --- Dataset ---
dataset:
  root: "data/dataset"
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  split_seed: 42
  metadata_file: "data/split_metadata.json"

# --- YOLO detection (Phase C/D) ---
yolo:
  model: "yolov8n.pt"
  input_size: 320
  confidence: 0.25
  iou_threshold: 0.45
  enabled: false          # enable after classifier works

# --- Federated Learning ---
federated:
  server_address: "0.0.0.0:8080"
  rounds: 10
  local_epochs: 1
  min_clients: 2
  method: fedavg          # fedavg | fedprox
  fedprox_mu: 0.01
  trainable_layers: "classifier"  # classifier | top_layers | all
  save_every_round: true

# --- Trap identity (overridden per-device) ---
trap:
  id: "trap_a"
  role: "server_client"   # server_client | client_only

# --- Logging ---
logging:
  csv_path: "results/events.csv"
  sqlite_path: "results/events.db"
  log_level: INFO

# --- Benchmarking ---
benchmark:
  num_warmup: 10
  num_iterations: 100
  input_size: 224

# --- Dashboard ---
dashboard:
  host: "0.0.0.0"
  port: 5000
  enabled: false
